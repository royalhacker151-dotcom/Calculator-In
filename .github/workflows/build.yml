name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "calcy-main Apk"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - name: List APK files
        run: find . -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "calcy-main Apk/**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
